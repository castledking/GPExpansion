title: "&6&lClaim Options - #{id}"
size: 45

filler:
  material: GRAY_STAINED_GLASS_PANE

items:
  summary:
    material: BOOK
    name: "&6&lClaim Summary"
    lore:
      - "&7Name: &f{name}"
      - "&7ID: &f{id}"
      - "&7Owner: &f{owner}"
      - "&7Type: &f{type}"
      - "&7Size: &f{dimensions}"
      - "&7Area: &f{area}"
      - "&7Coords: &f{location}"
      - "&7Children: &6{children}"
    slot: 4

  teleport:
    material: ENDER_PEARL
    name: "&b&lTeleport"
    lore:
      - "&7Teleport to this claim."
      - ""
      - "{teleport_status}"
      - "{teleport_action}"
    slot: 19

  resize:
    material: GOLDEN_SHOVEL
    name: "&6&lResize Claim"
    lore:
      - "&7Resize this claim."
      - ""
      - "{resize_status}"
      - "{resize_action}"
    slot: 21

  trust:
    material: PLAYER_HEAD
    skull-owner: "{player}"
    name: "&a&lManage Trust"
    lore:
      - "&7Manage trusted players on this claim."
      - ""
      - "{trust_status}"
      - "{trust_action}"
    slot: 23

  abandon:
    material: CAULDRON
    name: "&4&lAbandon Claim"
    lore:
      - "{abandon_status}"
      - ""
      - "{abandon_action}"
    slot: 36

  view-children:
    material: CHEST
    name: "&6&lView Children"
    lore:
      - "&7Browse subdivisions inside this claim."
      - ""
      - "&7Children: &6{children}"
      - "&eClick to view children"
    slot: 38

  claim-flags:
    material: REPEATER
    name: "&d&lClaim Flags"
    lore:
      - "&7Choose what outsiders, mobs and"
      - "&7nature can do in this claim."
      - ""
      - "{flags_status}"
      - "{flags_action}"
    slot: 40

  global-settings:
    material: ENDER_CHEST
    name: "&6&lGlobal Settings"
    lore:
      - "&7Manage claim name, icon, description,"
      - "&7public listing, and spawn point."
      - ""
      - "&eClick to open global settings"
    slot: 25

  # Always shown. Giving claims to other players needs GriefPrevention3D with
  # Claims.TransferClaim.Enabled: true; elsewhere the button explains why it is unavailable.
  # Placeholders: {transfer_status}, {transfer_action}, {fee}
  transfer:
    material: TRIAL_KEY
    # Optional material used while transfers are unavailable (blank keeps the material above)
    unavailable-material: ""
    name: "&e&lTransfer Ownership"
    lore:
      - "&7Give this claim to another player."
      - ""
      - "{transfer_status}"
      - "{transfer_action}"
    slot: 42
    states:
      available:
        status: "&aCost: &f{fee}"
        action: "&eClick to choose the new owner"
      unsupported:
        status: "&cUnavailable"
        action: "&8Requires GriefPrevention3D with TransferClaim enabled"
      disabled:
        status: "&cUnavailable"
        action: "&8Claim transfers are turned off on this server"
      subdivision:
        status: "&cOnly top-level claims can change owner"
        action: "&8Transfer the parent claim instead"
      no-access:
        status: "&cOnly the owner can give this claim away"
        action: "&8You must own this claim"

  back:
    material: ARROW
    name: "&c&lBack"
    lore:
      - "&7Return to the previous menu"
    slot: 44

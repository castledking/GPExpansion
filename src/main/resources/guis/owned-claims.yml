# Owned Claims ("My Claims") GUI Configuration
# Unified view covering Owned, Trusted, Rented, Bought, Mailboxes, and Listed claims

title: "&6&lMy Claims"
title-search: "&6&lMy Claims - \"{query}\""
size: 54

filler:
  material: GRAY_STAINED_GLASS_PANE

items:
  claim:
    name: "&6{name}"
    lore:
      - "&7ID: &f{id}"
      - "&7Location: &f{location}"
      - "&7Area: &f{area} blocks"
      - "&7Children: &6{children}"

  filter:
    material: HOPPER
    name: "&6&lFilter: {filter}"
    lore:
      - "&7Current: &e{filter}"
      - ""
      - "&eClick to cycle filter"

  back:
    material: ARROW
    name: "&c&lBack"
    lore:
      - "&7Return to main menu"

  prev-page:
    material: ARROW
    name: "&e&l« Previous Page"
    lore:
      - "&7Page {current}/{total}"

  next-page:
    material: ARROW
    name: "&e&lNext Page »"
    lore:
      - "&7Page {current}/{total}"

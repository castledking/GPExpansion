# Icon Selection GUI Configuration
# Hopper inventory for selecting claim icons

title: "&6&lSelect Icon - Place item in center"
size: 5

filler:
  material: GRAY_STAINED_GLASS_PANE

slots:
  instructions: 0
  center: 2
  back: 4

items:
  instructions:
    material: PAPER
    name: "&e&lInstructions"
    lore:
      - "&7Click any item onto the center slot,"
      - "&7press its hotbar key over the slot,"
      - "&7or shift-click it in your inventory"
      - "&7to set it as the claim icon."
      - ""
      - "&7Custom items keep their look."
      - "&7The item will NOT be consumed."

  # Shown in the center slot when the claim already has an icon
  current:
    name: "&a&lCurrent Icon"
    lore:
      - "&7Click an item onto this slot"
      - "&7to replace it."
  
  back:
    material: ARROW
    name: "&c&lCancel"
    lore:
      - "&7Return to previous menu"

messages:
  no-item: "&cNo item placed. Icon selection cancelled."
  success: "&aIcon set successfully!"
